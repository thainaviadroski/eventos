spring.application.name=eventos
spring.profiles.active=dev
spring.datasource.url=jdbc:mysql://localhost:3306/db_eventos
spring.datasource.username=eventos
spring.datasource.password=eventos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
devtools.livereload.enabled=true

#Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5
spring.flyway.baseline-description=Baseline do schema existente (criado anteriormente via hibernate ddl-auto)

#Folder for save image localy
app.upload.dir.certimage=certificados_images

#Max file size for uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
