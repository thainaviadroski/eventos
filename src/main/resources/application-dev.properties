# ============================================
# Flyway - Perfil de Desenvolvimento
# ============================================
# Flyway combina TODAS as locations numa unica linha do tempo de versoes
# (a pasta de origem do arquivo não importa para o versionamento).
# Aqui somamos as migrations estruturais com os seeds de dados fake/mock,
# que só devem existir no ambiente de desenvolvimento.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Permite "flyway:clean" (apaga o schema inteiro) apenas em dev.
# Em produção isso deve ficar travado (veja application-prod.properties).
spring.flyway.clean-disabled=false

spring.jpa.show-sql=true
