# ============================================
# Flyway - Perfil de Produção
# ============================================
# Aponta EXPLICITAMENTE apenas para as migrations estruturais.
# Mesmo que a pasta db/seed acabe indo para o artefato final por engano,
# o Flyway nunca vai enxergá-la em produção porque ela não está listada aqui.
spring.flyway.locations=classpath:db/migration

# Trava de segurança: nunca permitir apagar o schema em produção.
spring.flyway.clean-disabled=true

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
